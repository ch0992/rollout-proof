name: Implementation task
description: AI가 하나의 context에서 구현하고 평가할 수 있는 atomic task
title: "[TASK] "
labels: ["task", "needs-refinement"]
body:
  - type: markdown
    attributes:
      value: |
        이 이슈는 `docs/ai-development-playbook.md`의 Definition of Ready와 Done을 따릅니다.
  - type: input
    id: parent
    attributes:
      label: Parent Epic
      description: 상위 Epic ID 또는 링크
      placeholder: P0-E1
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Task size
      options: [XS, S, M]
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: 이 작업이 필요한 이유를 3~5문장으로 작성합니다.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Requirement references
      description: Requirement ID와 정확한 문서 heading/ADR을 적습니다.
      placeholder: |
        - ENG-WATCH-001
        - docs/implementation-spec.md#73-listwatch-supervisor
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 이 이슈에서 구현할 항목만 적습니다.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: 이번 이슈에서 명시적으로 구현하지 않을 항목입니다.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Expected files
      description: 주요 수정/생성 예상 파일입니다. 주요 파일 4개 초과 시 분할을 검토합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: AC-1 형식으로 3~7개의 검증 가능한 조건을 적습니다.
      placeholder: |
        - [ ] AC-1: Given ..., when ..., then ...
        - [ ] AC-2: ...
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification commands
      description: 실행할 1~3개 명령과 예상 결과를 적습니다.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: rubric
    attributes:
      label: Evaluation rubric
      options:
        - label: Correctness — 모든 AC에 evidence가 있어야 한다.
          required: true
        - label: Scope — non-goal과 무관한 변경이 없어야 한다.
          required: true
        - label: Tests — targeted/affected test가 통과해야 한다.
          required: true
        - label: Safety — 해당 보안, timeout, cancel 조건을 만족해야 한다.
          required: true
        - label: Maintainability — package 책임과 명시적 의존성을 유지해야 한다.
          required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: 선행 이슈, 외부 결정 또는 없음을 적습니다.
    validations:
      required: true
  - type: checkboxes
    id: ready
    attributes:
      label: Definition of Ready
      options:
        - label: 상위 Epic과 requirement ID가 있다.
          required: true
        - label: Scope와 non-goal이 명확하다.
          required: true
        - label: Acceptance criterion이 검증 가능하다.
          required: true
        - label: 이 Task는 XS, S 또는 M 크기다.
          required: true

